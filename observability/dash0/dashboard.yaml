# Dash0 dashboard (PersesDashboard). Generated by gen_dashboard.py; edit there.
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: leadguard-conference-health
  labels:
    dash0.com/id: leadguard-conference-health
spec:
  display:
    name: 'LeadGuard: conference health'
    description: Desks, booths, scanners and lead integrity. Built from the metrics LeadGuard emits; see observability/README.md.
  duration: 1h
  refreshInterval: 30s
  panels:
    checkins:
      kind: Panel
      spec:
        display:
          name: Check-ins per minute, by desk
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (leadguard_desk_id) (rate(leadguard_checkins_total[2m])) * 60
    scans:
      kind: Panel
      spec:
        display:
          name: Scans per minute, by booth
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (leadguard_booth_id) (rate(leadguard_scans_total{outcome="accepted"}[2m])) * 60
    synclag:
      kind: Panel
      spec:
        display:
          name: "Scan \u2192 synced lead, p95 (s). SLO: < 30 s"
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (le) (rate(leadguard_scan_sync_lag_seconds_bucket[5m])))
    queue:
      kind: Panel
      spec:
        display:
          name: Scans waiting on devices (p95 of heartbeats), by booth
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (le, leadguard_booth_id) (rate(leadguard_scanner_queue_depth_bucket[5m])))
    anomalies:
      kind: Panel
      spec:
        display:
          name: Integrity anomalies (new, last 15 min), by kind
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (leadguard_anomaly_kind) (increase(leadguard_anomalies_total[15m]))
    outcomes:
      kind: Panel
      spec:
        display:
          name: Scan outcomes (accepted / duplicate retry / rejected)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum by (outcome) (rate(leadguard_scans_total[5m])) * 60
    ingest5xx:
      kind: Panel
      spec:
        display:
          name: Ingest error ratio (writes that must not be lost)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(rate(http_server_request_duration_seconds_count{service_name="leadguard-ingest", http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name="leadguard-ingest"}[5m]))
    latency:
      kind: Panel
      spec:
        display:
          name: p95 latency by route (s)
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket{service_name=~"leadguard-.*", http_route=~"/api/.*"}[5m])))
    notfound:
      kind: Panel
      spec:
        display:
          name: Desk searches that found nobody (last 10 min)
        plugin:
          kind: StatChart
          spec:
            calculation: last-number
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                query: sum(increase(leadguard_desk_not_found_total[10m]))
  layouts:
  - kind: Grid
    spec:
      items:
      - x: 0
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/checkins'
      - x: 12
        y: 0
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/scans'
      - x: 0
        y: 8
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/synclag'
      - x: 12
        y: 8
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/queue'
      - x: 0
        y: 16
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/anomalies'
      - x: 12
        y: 16
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/outcomes'
      - x: 0
        y: 24
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/ingest5xx'
      - x: 12
        y: 24
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/latency'
      - x: 0
        y: 32
        width: 12
        height: 8
        content:
          $ref: '#/spec/panels/notfound'
