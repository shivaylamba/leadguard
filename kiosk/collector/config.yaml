# One Collector: OBI (flows + RED over OTLP) in, Prometheus out. Profiles go straight from the profiler to Pyroscope.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
exporters:
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  debug:
    verbosity: basic
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
