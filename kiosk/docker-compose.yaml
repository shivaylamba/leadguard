# LeadGuard check-in kiosk, watched by eBPF with no code in the kiosk.
# Adapted from Ekansh Gupta and Shivanshu Raj Shrivastava's Observability Day rig
# (github.com/eKuG/obs-day-na26, "Auto Deriving Threat Signals from OTel CPU Profiles & OBI Network Flows").
#   make up       backends + kiosk + badge taps + OBI + profiler
#   make incident simulate a compromised kiosk: unplanned listener on 4444 + an unknown peer polling it
#   make calm     stop the incident
# Runs on a laptop (Docker Desktop's Linux VM): eBPF needs privileged + host pid, which the Radar cluster refuses.
name: leadguard-kiosk
networks:
  default:
    name: threatsig
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  # ---- The workload we know about: a badge check-in kiosk ----------------------------------------
  kiosk:
    image: python:3.12-slim   # pinned: the eBPF profiler supports Python up to 3.14
    container_name: kiosk
    command: ["python", "/app/app.py"]
    environment:
      LEADGUARD_URL: ${LEADGUARD_URL:-http://host.docker.internal:18080}
      KIOSK_ID: ${KIOSK_ID:-kiosk-1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["./apps/kiosk:/app:ro"]
    ports: ["18088:8080"]
    networks:
      default:
        ipv4_address: 172.30.0.10

  badge-taps:
    image: busybox:latest
    container_name: badge-taps
    command: ["sh", "/loop.sh"]
    environment:
      TARGET: http://kiosk:8080/tap
    volumes: ["./apps/badge-taps/loop.sh:/loop.sh:ro"]
    networks:
      default:
        ipv4_address: 172.30.0.20
    depends_on: [kiosk]

  # ---- The unknown peer (started by `make incident`): polls the unplanned listener on 4444 ------
  unknown-client:
    image: busybox:latest
    container_name: unknown-client
    command: ["sh", "/loop.sh"]
    environment:
      TARGET: http://172.30.0.10:4444/job
    volumes: ["./apps/unknown-client/loop.sh:/loop.sh:ro"]
    networks:
      default:
        ipv4_address: 172.30.0.66
    profiles: ["incident"]

  # ---- The two eBPF signals ---------------------------------------------------------------------
  obi:
    image: otel/ebpf-instrument:v1.0.0
    container_name: obi
    privileged: true
    pid: "host"
    network_mode: "host"          # host netns: the socket filter sees every container's traffic on the bridge
    environment:
      OTEL_EBPF_CONFIG_PATH: /etc/obi/config.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:14318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EBPF_METRICS_FEATURES: application,network
      OTEL_EBPF_METRICS_INTERVAL: 10s
      OTEL_EBPF_LOG_LEVEL: INFO
    volumes:
      - ./obi/config.yaml:/etc/obi/config.yaml:ro
      - /sys/kernel/tracing:/sys/kernel/tracing
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /sys/fs/bpf:/sys/fs/bpf
    depends_on: [otelcol]

  profiler:
    image: otel/opentelemetry-collector-ebpf-profiler:0.164.0
    container_name: profiler
    command: ["--config=/etc/profiler.yaml", "--feature-gates=service.profilesSupport"]
    privileged: true
    pid: "host"
    volumes:
      - ./profiler/config.yaml:/etc/profiler.yaml:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    depends_on: [pyroscope]

  # ---- Pipeline + backends --------------------------------------------------------------------
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.164.0
    container_name: otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["14317:4317", "14318:4318"]
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=2d
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["19091:9090"]

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: pyroscope
    ports: ["4040:4040"]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["13301:3000"]
    depends_on: [prometheus, pyroscope]
