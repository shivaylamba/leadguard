# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-overflow
resources:
  - otel-sdk.yaml
  - otel-collector.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - ingest.yaml
  - integrity.yaml
  - analysis-template.yaml
  - seed-job.yaml
images:
  - name: app
    newName: ghcr.io/shivaylamba/leadguard
    newTag: 79e52a6
