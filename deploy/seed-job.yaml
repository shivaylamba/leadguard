# Create indices and load booths + attendees after every sync. Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: app
          command: ["node", "src/seed.js"]
          env:
            - { name: OTEL_SERVICE_NAME, value: leadguard-seed }
            - { name: ES_REQUEST_TIMEOUT_MS, value: "300000" }
            - name: ES_URL
              valueFrom: { secretKeyRef: { name: es-credentials, key: url } }
            - name: ES_API_KEY
              valueFrom: { secretKeyRef: { name: es-credentials, key: api-key, optional: true } }
            - name: SEMANTIC_INFERENCE_ID
              valueFrom: { secretKeyRef: { name: es-credentials, key: semantic-inference-id, optional: true } }
          envFrom:
            - configMapRef: { name: otel-sdk }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
