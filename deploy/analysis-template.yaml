# Judge the ingest canary on ITS OWN pods (pod name = ingest-<pod-template-hash>-<id>),
# not service-wide, so a regression on half the writes isn't diluted by the stable pods.
# Too little traffic is inconclusive, never a pass. Metric: OTel HTTP server semconv,
# exported by the SDK's Prometheus exporter and scraped by the in-cluster Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ingest-health
spec:
  args:
    - name: canary-hash
    - name: prometheus
      value: http://prometheus-server.monitoring
  metrics:
    - name: ingest-error-rate
      interval: 30s
      count: 4
      failureLimit: 1
      inconclusiveLimit: 3
      successCondition: len(result) > 0 && result[0] < 0.01
      failureCondition: len(result) > 0 && result[0] >= 0.01
      provider:
        prometheus:
          address: "{{args.prometheus}}"
          query: |
            (
              sum(rate(http_server_request_duration_count{pod=~"ingest-{{args.canary-hash}}-.*", http_route=~"/api/(checkin|scans/batch|scanners/heartbeat)", http_response_status_code=~"5.."}[2m]))
              or vector(0)
            )
            /
            sum(rate(http_server_request_duration_count{pod=~"ingest-{{args.canary-hash}}-.*", http_route=~"/api/(checkin|scans/batch|scanners/heartbeat)"}[2m]))
            and
            sum(increase(http_server_request_duration_count{pod=~"ingest-{{args.canary-hash}}-.*", http_route=~"/api/(checkin|scans/batch|scanners/heartbeat)"}[2m])) > 5
