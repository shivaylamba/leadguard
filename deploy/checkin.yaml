# checkin role: POST /api/checkin. An Argo Rollout canary gated by analysis on its own pods.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: checkin
  labels:
    app: checkin
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: checkin
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: checkin-health
            args:
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
  template:
    metadata:
      labels:
        app: checkin
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      containers:
        - name: checkin
          image: app
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9464
          env:
            - { name: ROLE, value: checkin }
            - { name: OTEL_SERVICE_NAME, value: overflow-checkin }
            - name: ES_URL
              valueFrom: { secretKeyRef: { name: es-credentials, key: url } }
            - name: ES_API_KEY
              valueFrom: { secretKeyRef: { name: es-credentials, key: api-key, optional: true } }
            - name: PSEUDONYM_SALT
              valueFrom: { secretKeyRef: { name: app-credentials, key: pseudonym-salt, optional: true } }
          envFrom:
            - configMapRef: { name: otel-sdk }
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 300m, memory: 320Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: checkin
spec:
  selector:
    app: checkin
  ports:
    - name: http
      port: 80
      targetPort: http
