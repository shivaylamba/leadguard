# Civo stand-in cluster: the same app as deploy/ (the Radar team cluster), in namespace team-overflow.
# Image tags come from deploy/kustomization.yaml, so both clusters run the same build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-overflow
resources:
  - ../../deploy
patches:
  # The namespace transformer doesn't touch ClusterRoleBinding subjects.
  - target: { kind: ClusterRoleBinding, name: leadguard-otel-collector }
    patch: |
      - { op: replace, path: /subjects/0/namespace, value: team-overflow }
