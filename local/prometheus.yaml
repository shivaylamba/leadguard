# Mirrors the Radar vcluster's Prometheus: monitoring/prometheus-server, scrapes pods annotated
# prometheus.io/scrape=true every 30 s and keeps the pod name (the canary analysis matches on it).
apiVersion: v1
kind: Namespace
metadata: { name: monitoring }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: local-prometheus }
rules:
  - { apiGroups: [""], resources: [pods, services, endpoints, nodes], verbs: [get, list, watch] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: local-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: local-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: monitoring }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus, namespace: monitoring }
data:
  prometheus.yml: |
    global: { scrape_interval: 30s }
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus-server, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus-server } }
  template:
    metadata: { labels: { app: prometheus-server } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts: [{ name: conf, mountPath: /etc/prometheus }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
      volumes: [{ name: conf, configMap: { name: prometheus } }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus-server, namespace: monitoring }
spec:
  selector: { app: prometheus-server }
  ports: [{ name: http, port: 80, targetPort: http }]
