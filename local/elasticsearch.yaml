apiVersion: v1
kind: Namespace
metadata: { name: es }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: elasticsearch, namespace: es }
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: { matchLabels: { app: elasticsearch } }
  template:
    metadata: { labels: { app: elasticsearch } }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: xpack.license.self_generated.type, value: trial }
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
          ports: [{ name: http, containerPort: 9200 }]
          resources:
            requests: { cpu: 500m, memory: 3Gi }
            limits: { cpu: "3", memory: 5Gi }
          volumeMounts: [{ name: data, mountPath: /usr/share/elasticsearch/data }]
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: http }
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: elasticsearch, namespace: es }
spec:
  selector: { app: elasticsearch }
  ports: [{ name: http, port: 9200, targetPort: http }]
